# Roasted Umber
set -g status-style "bg=#241c15,fg=#d9c8b8"
setw -g window-status-style "bg=#241c15,fg=#bfae9d"
setw -g window-status-current-style "bg=#d3a35f,fg=#16110d"
setw -g window-status-activity-style "fg=#8fac93"
setw -g window-status-bell-style "bg=#cf6f52,fg=#16110d"

set -g pane-border-style "fg=#3e3225"
set -g pane-active-border-style "fg=#d3a35f"
set -g message-style "bg=#3e3225,fg=#d9c8b8"
set -g message-command-style "bg=#3e3225,fg=#d3a35f"
set -g mode-style "bg=#3e3225,fg=#efe3d5"
set -g display-panes-colour "#6d5e50"
set -g display-panes-active-colour "#d3a35f"
setw -g clock-mode-colour "#8c95a8"
